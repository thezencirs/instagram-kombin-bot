name: GüzelAI Holding A.Ş. 7/24 Argon'suz Bulut 36-Ajan (İK/CV Akademisi, Manken, Moda, Reklam/Sinema & Medya Ajansı) 2K Reels Otomasyonu

on:
  schedule:
    # Türkiye Saati (TSİ / UTC+3) ile her gün 4 Kuşak (Kadın -> Erkek -> Kız Çocuk -> Erkek Çocuk Rotasyonu + Otomatik Viral Uçuş Bölümleri):
    # 06:15 UTC = 09:15 TSİ (Sabah Kuşağı - DEFNE Kadın Kış Tasarım + BARIŞ Senaryo)
    # 10:15 UTC = 13:15 TSİ (Öğle Kuşağı - KEREM Erkek Kış Tasarım + BARIŞ Senaryo)
    # 14:15 UTC = 17:15 TSİ (İkindi Kuşağı - LEYLA Kız Çocuk Kış Tasarım + BARIŞ Senaryo)
    # 17:15 UTC = 20:15 TSİ (Akşam Prime-Time Kuşağı - MERT Erkek Çocuk Kış Tasarım + BARIŞ Senaryo)
    - cron: '15 6,10,14,17 * * *'
  workflow_dispatch:
    inputs:
      slot_name:
        description: 'Paylaşım Kuşağı (sabah / oglen / ikindi / aksam / otomatik)'
        required: false
        default: 'otomatik'
      force_segment:
        description: 'Manken Segmenti (otomatik / kadin / erkek / kiz_cocuk / erkek_cocuk / cift)'
        required: false
        default: 'otomatik'
      force_archetype_id:
        description: 'Zorunlu Kombin ID (boş bırakılırsa sıradaki segment kombini seçilir)'
        required: false
        default: ''
      force_viral_flight:
        description: 'GuzelAI Viral Uçuş Bölümü Zorla (0: Otomatik Evrimsel Ritim / 1: Hemen Viral Uçuş Modu)'
        required: false
        default: '0'
      bypass_cooldown:
        description: '2 Saatlik Çift-Tetikleme Korumasını Atla (0 / 1)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: guzelai-primetime-publisher
  cancel-in-progress: false

jobs:
  create-and-publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Proje Dosyalarını Çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 FFmpeg ve Sistem Kütüphanelerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libgl1

      - name: 📦 Python Paketlerini Yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 1. Adım — GüzelAI Holding Reklam & Sinema Ajansı (ATLAS/LARA/BARIŞ/OZAN) + Manken & Moda Ajansı 2K Sinematik Reels Üretimi
        env:
          IG_WATERMARK: ${{ vars.IG_WATERMARK || '@guzelaicom' }}
          GH_TOKEN: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}
          SLOT_NAME: ${{ github.event.inputs.slot_name || 'otomatik' }}
          FORCE_SEGMENT: ${{ github.event.inputs.force_segment || 'otomatik' }}
          FORCE_ARCHETYPE_ID: ${{ github.event.inputs.force_archetype_id || '' }}
          FORCE_VIRAL_FLIGHT: ${{ github.event.inputs.force_viral_flight || '0' }}
          BYPASS_CLOUD_COOLDOWN: ${{ github.event.inputs.bypass_cooldown || '0' }}
          IG_ENABLE_UPLOAD: '0'
          TELEGRAM_ONLY_MODE: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '995164733' }}
        run: |
          python src/main.py --output output/reel_final.mp4

      - name: 🤖 2. Adım — GüzelAI Holding 36 Uzman Ajan Swarm (İK & CV Akademisi, Manken, Moda, Reklam/Sinema & Medya Ajansı) Denetimi
        env:
          GH_TOKEN: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}
          IG_ENABLE_UPLOAD: '0'
          TELEGRAM_ONLY_MODE: '1'
        run: |
          if [ -f output/skip_cooldown_active.flag ]; then
            echo "🛡️ Çift tetikleme koruması aktif, 2. adım atlandı."
            exit 0
          fi
          python src/kombin_agent_swarm.py --role all

      - name: 📱 3. Adım — Medya Ajansı (DENİZ) Telegram (@guzelaibot) 2K Sinema Paketi & GuzelAI.com Vitrin Yayını
        env:
          IG_ENABLE_UPLOAD: '0'
          TELEGRAM_ONLY_MODE: '1'
          GH_TOKEN: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '995164733' }}
        run: |
          if [ -f output/skip_cooldown_active.flag ]; then
            echo "🛡️ Çift tetikleme koruması aktif, mükerrer Telegram yayını güvenle atlandı."
            exit 0
          fi
          python src/instagram_uploader.py --video output/reel_final.mp4 --caption-file output/caption.txt --all-channels

      - name: 📤 4. Adım — 2K Sinematik Reels, Holding 36-Ajan CV Sicilleri, Sinema Kalite Sertifikası ve Denetim Raporlarını Kaydet
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kombin-reels-2k-${{ github.run_number }}
          path: |
            output/reel_final.mp4
            output/hook_cover.jpg
            output/pinterest_fashion_collage.jpg
            output/caption.txt
            output/guzelai_holding_agent_cvs.json
            output/guzelai_holding_agent_cvs.md
            output/reels_cinema_quality_report.json
            output/reels_cinema_quality_report.md
            output/self_evolution_genome.json
            output/viral_screenplay_current.json
            output/self_evolution_report.json
            output/self_evolution_report.md
            output/zero_repeat_ledger.json
            output/dynamic_creations_catalog.json
            output/fashion_atelier_designers_report.json
            output/fashion_atelier_designers_report.md
            output/agent_resources_division_report.json
            output/agent_resources_division_report.md
            output/quality_check_report.json
            output/visual_1to1_match_inspection_report.json
            output/hr_department_audit_and_training_report.json
            output/prepublish_compliance_certificate.json
            output/viral_music_selection_report.json
            output/social_health_report.json
            output/outfit_links.json
          retention-days: 7

      - name: 💾 5. Adım — Holding CV Sicilini, Evrimsel Hafızayı, Sıfır-Tekrar Defterini ve Bulut Kreasyonlarını Depoya Kaydet
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f output/skip_cooldown_active.flag ]; then
            rm -f output/skip_cooldown_active.flag
            exit 0
          fi
          git config user.name "GuzelAI Holding 36-Agent Bot"
          git config user.email "bot@guzelai.com"
          shopt -s nullglob
          git add \
            output/guzelai_holding_agent_cvs.json \
            output/guzelai_holding_agent_cvs.md \
            output/reels_cinema_quality_report.json \
            output/reels_cinema_quality_report.md \
            output/self_evolution_genome.json \
            output/viral_screenplay_current.json \
            output/self_evolution_report.json \
            output/self_evolution_report.md \
            output/zero_repeat_ledger.json \
            output/dynamic_creations_catalog.json \
            output/fashion_atelier_designers_report.json \
            output/fashion_atelier_designers_report.md \
            output/agent_resources_division_report.json \
            output/agent_resources_division_report.md \
            output/instagram_uploaded_history.json \
            output/published_outfits_history.json \
            output/last_used_music_profiles.json \
            output/social_health_report.json \
            output/prepublish_compliance_certificate.json \
            output/visual_1to1_match_inspection_report.json \
            output/hr_department_audit_and_training_report.json || true
          atelier_files=(assets/atelier_* assets/items/atelier_*)
          if [ ${#atelier_files[@]} -gt 0 ]; then
            git add "${atelier_files[@]}" || true
          fi
          git diff --staged --quiet || (git commit -m "chore(holding-36-agents): persist zero-repeat ledger, CVs, cinema telemetry & evolution genome [skip ci]" && (git pull --rebase origin main || true) && git push)

      - name: ☁️ 6. Adım — Tüm Verileri, 2K Reels Videosunu ve Raporları Google Drive'a (mehmetzenciir@gmail.com) Kaydet
        if: ${{ always() }}
        env:
          GDRIVE_BRIDGE_URL: ${{ secrets.GDRIVE_BRIDGE_URL }}
        run: |
          python src/google_drive_sync.py --mode cloud-post-run || true
